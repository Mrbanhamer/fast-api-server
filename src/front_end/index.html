<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Home Page</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel='stylesheet' href='front_end/css/index.css'>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="front_end/javascript/Header.jsx"></script>

    <script type="text/babel">
      function App() {
        return (
          <div>
            <Header />  {/* This pulls in your old header.html code! */}
            <main>
              <h2>Welcome to the Body</h2>
              <p>Everything is now managed by React.</p>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
