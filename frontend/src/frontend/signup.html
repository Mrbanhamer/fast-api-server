<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Sign Up</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel='stylesheet' href='/css/index.css'>
</head>
<body>
    <div id="root"></div>

    <!-- Load our Components -->
    <script type="text/babel" src="/javascript/Header.jsx"></script>
    <script type="text/babel" src="/javascript/Signup.jsx"></script>

    <script type="text/babel">
    function App() {
        // If either Header or Signup failed to load, this whole function crashes
        return (
        <div>
            <Header />
            <Signup />
        </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
